<div id="JellySpotlightConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-button,emby-input,emby-select,emby-checkbox">
  <div data-role="content"><div class="content-primary">
    <form id="JellySpotlightForm">
      <h1>JellySpotlight</h1>
      <p>A compact, multi-title shelf for the Jellyfin home screen.</p>
      <div class="checkboxContainer checkboxContainer-withDescription"><label class="emby-checkbox-label">
        <input id="SpotlightEnabled" type="checkbox" is="emby-checkbox"><span>Show JellySpotlight</span>
      </label></div>
      <div class="selectContainer"><label class="selectLabel" for="SpotlightSource">Content source</label>
        <select id="SpotlightSource" is="emby-select" class="emby-select-withcolor emby-select">
          <option value="hot">What's hot right now (Jelana)</option>
          <option value="recent">Recently added</option>
          <option value="newPopular">New and popular (Jelana)</option>
        </select>
        <div class="fieldDescription">Jelana sources reuse its hourly cached analytics and never query Playback Reporting live.</div>
      </div>
      <div class="inputContainer"><label class="inputLabel inputLabelUnfocused" for="SpotlightTitle">Shelf title</label>
        <input id="SpotlightTitle" is="emby-input" maxlength="80">
      </div>
      <div class="selectContainer"><label class="selectLabel" for="SpotlightDensity">Card size</label>
        <select id="SpotlightDensity" is="emby-select" class="emby-select-withcolor emby-select">
          <option value="compact">Compact</option><option value="standard">Standard</option>
        </select>
      </div>
      <div class="selectContainer"><label class="selectLabel" for="SpotlightCount">Titles to load</label>
        <select id="SpotlightCount" is="emby-select" class="emby-select-withcolor emby-select">
          <option>6</option><option selected>8</option><option>10</option><option>12</option><option>16</option>
        </select>
      </div>
      <div class="checkboxContainer checkboxContainer-withDescription"><label class="emby-checkbox-label">
        <input id="SpotlightMetrics" type="checkbox" is="emby-checkbox"><span>Show plays and viewer metrics</span>
      </label></div>
      <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
    </form>
  </div></div>
  <script>
  (() => {
    const id = 'f41f333d-4be5-41df-9b23-d6b5c768ac63';
    const page = document.querySelector('#JellySpotlightConfigPage');
    const form = page.querySelector('#JellySpotlightForm');
    page.addEventListener('pageshow', async () => {
      Dashboard.showLoadingMsg();
      const c = await ApiClient.getPluginConfiguration(id);
      page.querySelector('#SpotlightEnabled').checked = c.Enabled ?? true;
      page.querySelector('#SpotlightSource').value = c.Source || 'hot';
      page.querySelector('#SpotlightTitle').value = c.Title || "What's hot right now";
      page.querySelector('#SpotlightDensity').value = c.Density || 'compact';
      page.querySelector('#SpotlightCount').value = String(c.ItemCount || 8);
      page.querySelector('#SpotlightMetrics').checked = c.ShowMetrics ?? true;
      Dashboard.hideLoadingMsg();
    });
    form.addEventListener('submit', async event => {
      event.preventDefault(); Dashboard.showLoadingMsg();
      const c = await ApiClient.getPluginConfiguration(id);
      c.Enabled = page.querySelector('#SpotlightEnabled').checked;
      c.Source = page.querySelector('#SpotlightSource').value;
      c.Title = page.querySelector('#SpotlightTitle').value.trim() || "What's hot right now";
      c.Density = page.querySelector('#SpotlightDensity').value;
      c.ItemCount = Number(page.querySelector('#SpotlightCount').value);
      c.ShowMetrics = page.querySelector('#SpotlightMetrics').checked;
      await ApiClient.updatePluginConfiguration(id, c);
      Dashboard.processPluginConfigurationUpdateResult({}); Dashboard.hideLoadingMsg();
    });
  })();
  </script>
</div>
